<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — ApexBlog Platform</title>
  <meta name="description" content="Register for an ApexBlog reader account.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="display: flex; flex-direction: column; justify-content: center; min-height: 100vh;">

  <!-- Navbar Simple -->
  <header class="navbar" style="position: absolute; top: 0; width: 100%;">
    <div class="container nav-container">
      <a href="/" class="brand">
        <div class="brand-icon">⚡</div>
        <div>Apex<span>Blog</span></div>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" title="Toggle Theme">☀️</button>
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 460px; margin: auto; padding: 6rem 1.5rem 2rem;">
    <div class="filter-bar" style="padding: 2.25rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.85rem; margin-bottom: 0.5rem;">Join ApexBlog</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">
          Create a free Reader account to participate in discussions and like articles.
        </p>
      </div>

        <!-- Accessible Alert Banner -->
        <div id="register-error-alert" role="alert" aria-live="polite" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; font-size: 0.9rem; margin-bottom: 1.25rem;"></div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-name">Your Full Name</label>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Alex Rivera" required autofocus autocomplete="name">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password (Minimum 6 characters)</label>
            <div style="position: relative; display: flex; align-items: center;">
              <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6" autocomplete="new-password" style="padding-right: 2.75rem; width: 100%;">
              <button type="button" id="btn-toggle-reg-password" class="btn-icon" aria-label="Show password" aria-pressed="false" style="position: absolute; right: 0.75rem; background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-muted); padding: 0.25rem; display: flex; align-items: center; justify-content: center;" title="Show/Hide Password">
                👁️
              </button>
            </div>
            <div id="password-hint" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem;">
              Must be at least 6 characters.
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="btn-submit-register" style="width: 100%; margin-top: 0.5rem;">
            Create Free Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
          Already have an account? 
          <a href="/login" style="font-weight: 600; color: var(--accent-light);">Sign In here</a>
        </div>
      </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const errorAlert = document.getElementById('register-error-alert');
        const passwordInput = document.getElementById('reg-password');
        const togglePasswordBtn = document.getElementById('btn-toggle-reg-password');
        const passwordHint = document.getElementById('password-hint');

        // Password visibility toggle
        togglePasswordBtn?.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          togglePasswordBtn.setAttribute('aria-pressed', isPassword ? 'true' : 'false');
          togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
          togglePasswordBtn.textContent = isPassword ? '🙈' : '👁️';
        });

        // Real-time password feedback
        passwordInput?.addEventListener('input', () => {
          const len = passwordInput.value.length;
          if (len === 0) {
            passwordHint.textContent = 'Must be at least 6 characters.';
            passwordHint.style.color = 'var(--text-muted)';
          } else if (len < 6) {
            passwordHint.textContent = `${6 - len} more character${6 - len > 1 ? 's' : ''} needed`;
            passwordHint.style.color = 'var(--warning, #f59e0b)';
          } else {
            passwordHint.textContent = '✓ Strong password length';
            passwordHint.style.color = 'var(--success, #10b981)';
          }
        });

        document.getElementById('register-form')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (errorAlert) errorAlert.style.display = 'none';

          const name = document.getElementById('reg-name').value.trim();
          const email = document.getElementById('reg-email').value.trim();
          const password = document.getElementById('reg-password').value;
          const btn = document.getElementById('btn-submit-register');

          if (!name || !email || !password) {
            if (errorAlert) {
              errorAlert.textContent = 'All fields are required.';
              errorAlert.style.display = 'block';
            }
            return;
          }

          if (password.length < 6) {
            if (errorAlert) {
              errorAlert.textContent = 'Password must be at least 6 characters in length.';
              errorAlert.style.display = 'block';
            }
            return;
          }

          try {
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const res = await API.request('/api/auth/register', {
              method: 'POST',
              body: JSON.stringify({ name, email, password })
            });

            API.setToken(res.token);
            API.setUser(res.user);

            showToast('Account created successfully! Welcome to ApexBlog.');

            setTimeout(() => {
              window.location.href = '/';
            }, 400);

          } catch (err) {
            const errMsg = err.message || 'Registration failed. Please try again.';
            if (errorAlert) {
              errorAlert.textContent = errMsg;
              errorAlert.style.display = 'block';
            }
            showToast(errMsg, 'error');
            btn.disabled = false;
            btn.textContent = 'Create Free Account';
          }
        });
      });
    </script>
  </body>
</html>
