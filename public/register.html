<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — ApexBlog Platform</title>
  <meta name="description" content="Register for an ApexBlog reader account.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="display: flex; flex-direction: column; justify-content: center; min-height: 100vh;">

  <!-- Navbar Simple -->
  <header class="navbar" style="position: absolute; top: 0; width: 100%;">
    <div class="container nav-container">
      <a href="/" class="brand">
        <div class="brand-icon">⚡</div>
        <div>Apex<span>Blog</span></div>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" title="Toggle Theme">☀️</button>
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 460px; margin: auto; padding: 6rem 1.5rem 2rem;">
    <div class="filter-bar" style="padding: 2.25rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.85rem; margin-bottom: 0.5rem;">Join ApexBlog</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">
          Create a free Reader account to participate in discussions and like articles.
        </p>
      </div>

        <!-- Accessible Alert Banner -->
        <div id="register-error-alert" role="alert" aria-live="polite" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; font-size: 0.9rem; margin-bottom: 1.25rem;"></div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-name">Your Full Name</label>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Alex Rivera" required autofocus autocomplete="name">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password (Minimum 6 characters)</label>
            <div style="position: relative; display: flex; align-items: center;">
              <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required autocomplete="new-password" style="padding-right: 2.75rem; width: 100%;">
              <button type="button" id="btn-toggle-reg-password" class="btn-icon btn-toggle-pw" aria-label="Show password" aria-pressed="false" style="position: absolute; right: 0.65rem; background: transparent; border: none; cursor: pointer; color: var(--text-muted); padding: 0.35rem; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-sm, 6px); transition: color 0.2s, background-color 0.2s;" title="Show password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <div id="password-hint" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem;">
              Must be at least 8 characters with uppercase, lowercase, number, & symbol.
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="btn-submit-register" style="width: 100%; margin-top: 0.5rem;">
            Create Free Account
          </button>
        </form>

        <div class="auth-divider">
          <span>OR CONTINUE WITH</span>
        </div>

        <div class="social-auth-stack">
          <!-- Google Sign Up Button -->
          <button type="button" class="btn-google" id="btn-google-signup" aria-label="Continue with Google (Sign up with Google)">
            <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span>Continue with Google</span><span class="sr-only" style="display:none;">Sign up with Google</span>
          </button>

          <!-- LinkedIn Sign Up Button -->
          <button type="button" class="btn-linkedin" id="btn-linkedin-signup" aria-label="Continue with LinkedIn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true">
              <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
            </svg>
            <span>Continue with LinkedIn</span>
          </button>

          <!-- GitHub Sign Up Button -->
          <button type="button" class="btn-github" id="btn-github-signup" aria-label="Continue with GitHub">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
            <span>Continue with GitHub</span>
          </button>
        </div>


        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
          Already have an account? 
          <a href="/login" style="font-weight: 600; color: var(--accent-light);">Sign In here</a>
        </div>
      </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const errorAlert = document.getElementById('register-error-alert');
        const passwordInput = document.getElementById('reg-password');
        const togglePasswordBtn = document.getElementById('btn-toggle-reg-password');
        const passwordHint = document.getElementById('password-hint');

        // Password visibility toggle with SVG icons
        const SVG_EYE_OPEN = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const SVG_EYE_OFF = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        togglePasswordBtn?.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          const newType = isPassword ? 'text' : 'password';
          passwordInput.setAttribute('type', newType);
          togglePasswordBtn.setAttribute('aria-pressed', isPassword ? 'true' : 'false');
          togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
          togglePasswordBtn.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
          togglePasswordBtn.innerHTML = isPassword ? SVG_EYE_OFF : SVG_EYE_OPEN;
          togglePasswordBtn.style.color = isPassword ? 'var(--accent-light, #38bdf8)' : 'var(--text-muted)';
        });

        // Real-time password feedback
        passwordInput?.addEventListener('input', () => {
          const val = passwordInput.value;
          const len = val.length;
          if (len === 0) {
            passwordHint.textContent = 'Must be at least 8 characters with uppercase, lowercase, number, & symbol.';
            passwordHint.style.color = 'var(--text-muted)';
          } else if (len < 8 || !/[A-Z]/.test(val) || !/[a-z]/.test(val) || !/[0-9]/.test(val) || !/[!@#$%^&*()_+\-=[\]{};':"\\|,.<>/?`~]/.test(val)) {
            passwordHint.textContent = 'Requires uppercase, lowercase, number, & special character.';
            passwordHint.style.color = 'var(--warning, #f59e0b)';
          } else {
            passwordHint.textContent = '✓ Strong password requirement met';
            passwordHint.style.color = 'var(--success, #10b981)';
          }
        });

        document.getElementById('register-form')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (errorAlert) errorAlert.style.display = 'none';

          const name = document.getElementById('reg-name').value.trim();
          const email = document.getElementById('reg-email').value.trim();
          const password = document.getElementById('reg-password').value;
          const btn = document.getElementById('btn-submit-register');

          if (!name || !email || !password) {
            if (errorAlert) {
              errorAlert.textContent = 'All fields are required.';
              errorAlert.style.display = 'block';
            }
            return;
          }

          if (password.length < 8) {
            const msg = 'Password must be at least 8 characters long.';
            if (errorAlert) {
              errorAlert.textContent = msg;
              errorAlert.style.display = 'block';
            }
            showToast(msg, 'error');
            return;
          }
          if (!/[A-Z]/.test(password)) {
            const msg = 'Password must contain at least one uppercase letter.';
            if (errorAlert) {
              errorAlert.textContent = msg;
              errorAlert.style.display = 'block';
            }
            showToast(msg, 'error');
            return;
          }
          if (!/[a-z]/.test(password)) {
            const msg = 'Password must contain at least one lowercase letter.';
            if (errorAlert) {
              errorAlert.textContent = msg;
              errorAlert.style.display = 'block';
            }
            showToast(msg, 'error');
            return;
          }
          if (!/[0-9]/.test(password)) {
            const msg = 'Password must contain at least one number.';
            if (errorAlert) {
              errorAlert.textContent = msg;
              errorAlert.style.display = 'block';
            }
            showToast(msg, 'error');
            return;
          }
          if (!/[!@#$%^&*()_+\-=[\]{};':"\\|,.<>/?`~]/.test(password)) {
            const msg = 'Password must contain at least one special character.';
            if (errorAlert) {
              errorAlert.textContent = msg;
              errorAlert.style.display = 'block';
            }
            showToast(msg, 'error');
            return;
          }

          try {
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const res = await API.request('/api/auth/register', {
              method: 'POST',
              body: JSON.stringify({ name, email, password })
            });

            API.setToken(res.token);
            API.setUser(res.user);

            showToast('Account created successfully! Welcome to ApexBlog.');

            setTimeout(() => {
              window.location.href = '/';
            }, 400);

          } catch (err) {
            const errMsg = err.message || 'Registration failed. Please try again.';
            if (errorAlert) {
              errorAlert.textContent = errMsg;
              errorAlert.style.display = 'block';
            }
            showToast(errMsg, 'error');
            btn.disabled = false;
            btn.textContent = 'Create Free Account';
          }
        });

        // Social Sign Up button click handlers
        document.getElementById('btn-google-signup')?.addEventListener('click', () => {
          window.location.href = '/auth/google';
        });
        document.getElementById('btn-linkedin-signup')?.addEventListener('click', () => {
          window.location.href = '/auth/linkedin';
        });
        document.getElementById('btn-github-signup')?.addEventListener('click', () => {
          window.location.href = '/auth/github';
        });
      });
    </script>
  </body>
</html>
