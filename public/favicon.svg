<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="tt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="tt-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Container Badge -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#tt-bg)" />

  <!-- Inner Conversation Speech Bubble -->
  <path d="M40 9C40 6.79 38.21 5 36 5H12C9.79 5 8 6.79 8 9V29C8 31.21 9.79 33 12 33H16V39.5C16 40.45 17.15 40.95 17.85 40.35L24.5 33H36C38.21 33 40 31.21 40 29V9Z" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Town Street Ground Line -->
  <path d="M12 28.5H36" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />

  <!-- Left Townhouse Building -->
  <path d="M14 28.5V20C14 19.4 14.5 19 15.1 19H19.9C20.5 19 21 19.4 21 20V28.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="17.5" cy="22.5" r="1.1" fill="#ffffff" />
  <circle cx="17.5" cy="25.5" r="1.1" fill="#ffffff" />

  <!-- Center Clocktower / Civic Hall -->
  <path d="M22.5 28.5V15.5L25 12.5L27.5 15.5V28.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="25" cy="18" r="1.3" fill="url(#tt-accent)" />
  <path d="M25 22V25.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

  <!-- Right Gabled House -->
  <path d="M29 28.5V19.5L32 17L35 19.5V28.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="32" cy="22.5" r="1.1" fill="#ffffff" />

  <!-- Talk / Broadcast Soundwaves from Tower -->
  <path d="M21 10C23.4 8.3 26.6 8.3 29 10" fill="none" stroke="url(#tt-accent)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M18 7C22.2 4.4 27.8 4.4 32 7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
